name: Release

# Push a tag like v0.1.0 on main → installers for every OS on a draft GitHub
# Release. A maintainer checks the files and publishes it (docs/release.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Draft with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > changes.md
          [ -s changes.md ] || { echo "No CHANGELOG.md section for $version"; exit 1; }
          # "Which file to download" first, then the changes
          { sed "s/VERSION/$version/g" .github/release-downloads.md; cat changes.md; } > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Findy $TAG" --notes-file notes.md
      - name: Upload the skill for AI assistants (spec 016 FR-011)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # FR-012: the findy folder at the root of the archive, as Claude expects
          archive="findy-skill-${TAG#v}.zip"
          (cd skills && zip -r -X "../$archive" findy)
          unzip -l "$archive"
          gh release upload "$TAG" "$archive" --clobber

  build:
    name: Installers (${{ matrix.os }})
    needs: draft
    # Spec 012 FR-010: build provenance attestations for every installer
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download Electron binary
        run: node -e "require('electron')"
      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          for i in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Build installers (FR-070)
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke test the packaged app
        run: npm run smoke:packaged
      - name: Upload to the draft release (FR-071)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          # Names a user understands (.github/release-downloads.md links to them)
          for dmg in dist/*-arm64.dmg; do mv "$dmg" "${dmg%-arm64.dmg}-macOS-Apple-Silicon.dmg"; done
          for dmg in dist/*-x64.dmg; do mv "$dmg" "${dmg%-x64.dmg}-macOS-Intel.dmg"; done
          # Spec 012 FR-003: the portable archive for Scoop (win.artifactName says "Setup")
          for zip in dist/*-Setup-*.zip; do mv "$zip" "dist/Findy-${TAG#v}-Windows-portable.zip"; done
          files=(dist/*.dmg dist/*.exe dist/*.zip dist/*.AppImage dist/*.deb)
          [ ${#files[@]} -gt 0 ] || { echo "No installers in dist/"; ls dist; exit 1; }
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
      - name: Attest the build provenance (spec 012 FR-010)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  checksums:
    name: SHA256SUMS.txt
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Spec 012 FR-009: one file with the sum of every download, for users and for
      # the Homebrew tap and the Scoop bucket (they check their downloads against it)
      - name: Sum the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          [ "$(wc -l < SHA256SUMS.txt)" -ge 6 ] || { echo "Expected at least 6 files"; exit 1; }
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
