name: CI

# Pull requests only: main is protected and gets only squash merges of PRs that
# passed these checks, so running them again after a merge adds nothing.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Spec 020 plan D-5: run only the checks of the part that the PR changes. A skipped job
  # passes; branch protection requires only "CI result".
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.files.outputs.desktop }}
      website: ${{ steps.files.outputs.website }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # If GitHub cannot list the files (a very large PR), run every check
          if ! files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only); then
            printf 'desktop=true\nwebsite=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          # The app: any file outside website/, except the deploy workflow of the website
          desktop=$(printf '%s\n' "$files" | grep -vE '^(website/|\.github/workflows/site\.yml$)' | grep -q . && echo true || echo false)
          # The website: its package and the repository files that it shows
          website=$(has '^(website/|docs/guide/|docs/screenshots/|assets/logo\.svg$|src/shared/project\.ts$|\.github/workflows/(ci|site)\.yml$)')
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop website=$website"

  quality-gate:
    name: Quality gate (lint, types, unit tests, coverage ≥ 80 %)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Build the browser extension (spec 019)
        run: npm run build:extension
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e-and-package:
    name: E2E + package (${{ matrix.os }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron downloads its binary on first use; parallel test workers would race on it
      - name: Download Electron binary
        run: node -e "require('electron')"
      # One virtual display for the whole job, ready before any Electron starts.
      # (xvfb-run started it together with the tests, and the first of the parallel
      # workers could launch before it was up: "Missing X server or $DISPLAY".)
      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          for i in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          [ -S /tmp/.X11-unix/X99 ] || { echo "Xvfb did not start"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: E2E tests (failed tests rerun once at the end)
        id: e2e
        run: npm run test:e2e:ci
      # Traces of failed tests, also of flaky ones (the rerun passed): read them before a fix
      - name: Upload traces of failed tests
        if: always() && steps.e2e.outputs.failures == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.os }}
          path: |
            e2e-traces/
            test-results/
          retention-days: 14
      - name: Package (unpacked)
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Sign ad hoc like the release (electron-builder skips signing on PRs);
          # an ad-hoc signature needs no secret
          CSC_FOR_PULL_REQUEST: true
      - name: Smoke test packaged app
        run: npm run smoke:packaged

  website:
    name: Website (lint, coverage ≥ 80 %, build, page tests)
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build (reads the latest release, spec 020 FR-010)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Tests of the built pages
        run: npm run test:built
      - name: Browser tests (axe, keyboard, system detection)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

  result:
    name: CI result
    if: always()
    needs: [changes, quality-gate, e2e-and-package, website]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job failed or was cancelled (a skipped job passes)
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
