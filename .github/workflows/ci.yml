name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (lint, types, unit tests, coverage ≥ 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e-and-package:
    name: E2E + package (${{ matrix.os }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron downloads its binary on first use; parallel test workers would race on it
      - name: Download Electron binary
        run: node -e "require('electron')"
      - name: E2E tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Package (unpacked)
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:packaged
      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
