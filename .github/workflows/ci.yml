name: CI

# Pull requests only: main is protected and gets only squash merges of PRs that
# passed these checks, so running them again after a merge adds nothing.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (lint, types, unit tests, coverage ≥ 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e-and-package:
    name: E2E + package (${{ matrix.os }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron downloads its binary on first use; parallel test workers would race on it
      - name: Download Electron binary
        run: node -e "require('electron')"
      # One virtual display for the whole job, ready before any Electron starts.
      # (xvfb-run started it together with the tests, and the first of the parallel
      # workers could launch before it was up: "Missing X server or $DISPLAY".)
      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          for i in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          [ -S /tmp/.X11-unix/X99 ] || { echo "Xvfb did not start"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: E2E tests (failed tests rerun once at the end)
        run: npm run test:e2e:ci
      - name: Package (unpacked)
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke test packaged app
        run: npm run smoke:packaged
