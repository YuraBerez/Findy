# Build targets: docs/release.md (FR-070)
appId: io.github.findy
productName: Findy
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# better-sqlite3 ships Node-API prebuilds for every target; no native rebuild needed (architecture D-2)
npmRebuild: false
asarUnpack:
  - '**/*.node'
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # No Developer ID yet: sign the whole bundle ad hoc. Without it only the Electron
  # binary keeps its linker signature, and Apple Silicon Macs report the downloaded
  # app as "damaged" with no way to open it (docs/release.md). Hardened runtime
  # rejects ad-hoc signed Electron frameworks, so it is off until real signing.
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    # Spec 012 FR-003: a portable archive for Scoop; renamed in release.yml
    - target: zip
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: Findy contributors <findy@users.noreply.github.com>
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: findy_${version}_amd64.${ext}
